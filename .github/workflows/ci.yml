name: CI

on:
  push:
  pull_request:
  # The recipes take charter-ai from PyPI, so a release can break one without a
  # commit here. A weekly run catches that before someone following a link does.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Against a mocked Gmail API: no credentials, no network.
      - name: Tests
        run: >
          uv run --python ${{ matrix.python-version }} --no-project
          --with "charter-ai>=0.2.7,<0.3" --with pytest --with pytest-asyncio --with respx
          pytest -q

      # The way a reader runs them: each script resolves its own inline dependencies.
      - name: Each recipe starts as a script
        run: |
          for recipe in gmail/*.py; do
            uv run --python ${{ matrix.python-version }} "$recipe" --help > /dev/null
          done
          uv run --python ${{ matrix.python-version }} gmail/send.py you@example.com | grep -q "^To: =?utf-8?q?M=C3=BCller=2C_Jos=C3=A9?="
